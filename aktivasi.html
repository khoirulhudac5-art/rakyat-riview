
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aktivasi Kartu | Rakyat Review</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #172033;
    }
    header {
      background: #10243e;
      color: white;
      padding: 32px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 10px; }
    header p { margin: 0; color: #cbd5e1; }
    main {
      max-width: 520px;
      margin: 35px auto;
      padding: 0 18px;
    }
    .card {
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 8px 25px #1720330d;
    }
    h2 { margin-top: 0; }
    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 25px;
      padding: 17px;
      border: 0;
      border-radius: 10px;
      background: #10243e;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .convert-button {
      margin-top: 10px;
      background: #2563eb;
      font-size: 15px;
      padding: 13px;
    }
    .hint {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
    #convertResult, #result {
      margin-top: 12px;
      line-height: 1.5;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <header>
    <h1>Rakyat Review</h1>
    <p>Aktivasi Kartu NFC & QR</p>
  </header>

  <main>
    <div class="card">
      <h2>Aktivasi Kartu</h2>
      <p>Lengkapi data berikut untuk mengaktifkan kartu Anda.</p>

      <form id="activationForm">
        <label for="cardCode">Kode Kartu</label>
        <input id="cardCode" required placeholder="Contoh: 002">

        <label for="activationCode">Kode Aktivasi</label>
        <input id="activationCode" type="password" required
               placeholder="Masukkan kode aktivasi">

        <label for="businessName">Nama Usaha</label>
        <input id="businessName" required
               placeholder="Nama usaha Anda">

        <label for="reviewUrl">Link Google Maps / Google Review</label>
        <input id="reviewUrl" type="url" required
               placeholder="https://maps.app.goo.gl/...">

        <button type="button" id="convertButton"
                class="convert-button">
          Konversi Otomatis ke Link Rating
        </button>

        <p class="hint">
          Tempel link lokasi Google Maps, lalu klik Konversi.
          Jika gagal, masukkan link Google Review langsung.
        </p>

        <p id="convertResult" role="status"
           aria-live="polite"></p>

        <label for="pin">Buat PIN Kartu</label>
        <input id="pin" type="password" required minlength="6"
               placeholder="Minimal 6 karakter">

        <button type="submit" id="activateButton">
          Aktivasi Kartu
        </button>
      </form>

      <p id="result" role="status" aria-live="polite"></p>
    </div>
  </main>

  <script>
    const reviewInput = document.getElementById("reviewUrl");
    const convertButton = document.getElementById("convertButton");
    const convertResult = document.getElementById("convertResult");

    reviewInput.addEventListener("input", () => {
      convertResult.textContent = "";
    });

    convertButton.addEventListener("click", async () => {
      const mapsUrl = reviewInput.value.trim();

      if (!mapsUrl) {
        convertResult.textContent =
          "Masukkan link Google Maps terlebih dahulu.";
        return;
      }

      convertButton.disabled = true;
      convertResult.textContent = "Sedang mengonversi link...";

      try {
        const response = await fetch("/api/convert-review", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ maps_url: mapsUrl })
        });

        const data = await response.json();

        if (response.ok &&
            typeof data.review_url === "string") {
          reviewInput.value = data.review_url;
          convertResult.textContent =
            "Berhasil! Link langsung ke menu rating sudah siap.";
        } else {
          convertResult.textContent =
            data.error || "Link belum bisa dikonversi otomatis.";
        }
      } catch {
        convertResult.textContent =
          "Gagal menghubungi server konversi.";
      } finally {
        convertButton.disabled = false;
      }
    });

    document.getElementById("activationForm")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        const result = document.getElementById("result");
        const button = document.getElementById("activateButton");

        const payload = {
          card_code: document.getElementById("cardCode").value.trim(),
          activation_code:
            document.getElementById("activationCode").value.trim(),
          business_name:
            document.getElementById("businessName").value.trim(),
          review_url: reviewInput.value.trim(),
          pin: document.getElementById("pin").value
        };

        button.disabled = true;
        result.textContent = "Sedang mengaktifkan kartu...";

        try {
          const response = await fetch("/api/activate-card", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (response.ok && data.success === true) {
            result.textContent = "Kartu berhasil diaktifkan!";
            this.reset();
            convertResult.textContent = "";
          } else {
            result.textContent =
              data.message || data.error || "Aktivasi gagal.";
          }
        } catch {
          result.textContent = "Gagal terhubung ke server.";
        } finally {
          button.disabled = false;
        }
      });
  </script>
</body>
</html>
