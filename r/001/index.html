
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rakyat Review</title>
</head>
<body>
  <p id="status">Menghubungkan ke Google Maps...</p>

  <script>
    const SUPABASE_URL = "https://svuagnobuhfpgzmsyxx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6-p6upj0Amrndlkgxp27iA_SuAwYxpn";

    async function bukaUlasan() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/card_public?card_code=eq.001&select=review_url`,
          {
            headers: {
              apikey: SUPABASE_KEY
            }
          }
        );

        if (!response.ok) throw new Error("Gagal mengambil data");

        const data = await response.json();
        const url = data[0]?.review_url;

        if (!url || !/^https:\/\//i.test(url)) {
          throw new Error("Link belum tersedia");
        }

        window.location.replace(url);
      } catch (error) {
        document.getElementById("status").textContent =
          "Kartu belum dapat dibuka. Hubungi pengelola.";
      }
    }

    bukaUlasan();
  </script>
</body>
</html>
